name: skopos

services:
  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: skopos
      POSTGRES_USER: skopos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skopos -d skopos"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/postgresql

  migrate:
    image: ${SKOPOS_IMAGE:-ghcr.io/skopos-org/skopos}:${SKOPOS_VERSION:-0.1.1}
    build:
      context: .
      args:
        SKOPOS_VERSION: ${SKOPOS_VERSION:-0.1.1}
    command: ["eval", "Skopos.Release.migrate()"]
    environment:
      DATABASE_HOST: database
      DATABASE_NAME: skopos
      DATABASE_USER: skopos
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SKOPOS_CREDENTIALS_KEY: ${SKOPOS_CREDENTIALS_KEY:?Set SKOPOS_CREDENTIALS_KEY}
      SKOPOS_TOKEN_SIGNING_SECRET: ${SKOPOS_TOKEN_SIGNING_SECRET:?Set SKOPOS_TOKEN_SIGNING_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  server:
    image: ${SKOPOS_IMAGE:-ghcr.io/skopos-org/skopos}:${SKOPOS_VERSION:-0.1.1}
    build:
      context: .
      args:
        SKOPOS_VERSION: ${SKOPOS_VERSION:-0.1.1}
    environment:
      DATABASE_HOST: database
      DATABASE_NAME: skopos
      DATABASE_USER: skopos
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SKOPOS_CREDENTIALS_KEY: ${SKOPOS_CREDENTIALS_KEY:?Set SKOPOS_CREDENTIALS_KEY}
      SKOPOS_TOKEN_SIGNING_SECRET: ${SKOPOS_TOKEN_SIGNING_SECRET:?Set SKOPOS_TOKEN_SIGNING_SECRET}
      SKOPOS_PUBLIC_URL: ${SKOPOS_PUBLIC_URL:-http://localhost:4000}
      SKOPOS_CASE_COLLECT_SECONDS: ${SKOPOS_CASE_COLLECT_SECONDS:-5}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SKOPOS_PORT:-4000}:4000"
    restart: unless-stopped

volumes:
  database:
