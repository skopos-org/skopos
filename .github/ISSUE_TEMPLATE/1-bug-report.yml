name: Bug report
description: Report unexpected behavior in Skopos.
labels: [bug]
body:
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or circumstances
      description: Describe what led to the problem, including reproduction steps if known.
  - type: input
    id: version
    attributes:
      label: Skopos version
      description: Release version, image tag, or commit, if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant details about the client, integrations, or managed systems involved.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
