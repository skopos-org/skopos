name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl autoconf automake libtool pkg-config libssl-dev
          mix deps.get
          mix assets.setup
      - name: Verify source
        env:
          MIX_ENV: test
        run: |
          mix ash.codegen --check
          mix precommit
          cargo fmt --manifest-path native/ipmi_nif/Cargo.toml --check
      - name: Verify CLI composition
        env:
          MIX_ENV: cli
        run: |
          mix compile --warnings-as-errors
          mix run --no-halt -- --help > cli-help.txt
          grep -q '^Usage:' cli-help.txt

  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' mix.exs | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match application version ${version}" >&2
            exit 1
          }
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          image=$(printf 'ghcr.io/%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

  build-cli:
    needs: [verify, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cli: "true"
      - name: Build CLI artifacts
        env:
          MIX_ENV: cli
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mix deps.get --only cli
          for target in linux_x86_64 linux_aarch64 macos_x86_64 macos_aarch64 windows_x86_64; do
            BURRITO_TARGET=${target} mix release skopos --overwrite
            test ! -e "_build/cli/rel/skopos/lib/skopos-${VERSION}/priv"
            test ! -e "_build/cli/rel/skopos/lib/skopos-${VERSION}/include"
          done
          for path in burrito_out/skopos_*; do
            target=${path#burrito_out/skopos_}
            mv "${path}" "burrito_out/skopos-${VERSION}-${target}"
          done
          cd burrito_out
          sha256sum skopos-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: skopos-${{ needs.version.outputs.value }}-cli
          path: burrito_out/
          if-no-files-found: error

  validate-cli:
    needs: [version, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_x86_64
          - runner: ubuntu-24.04-arm
            target: linux_aarch64
          - runner: macos-15-intel
            target: macos_x86_64
          - runner: macos-15
            target: macos_aarch64
          - runner: windows-2025
            target: windows_x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skopos-${{ needs.version.outputs.value }}-cli
          path: burrito_out

      - name: Run CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
          TARGET: ${{ matrix.target }}
        run: |
          binary="burrito_out/skopos-${VERSION}-${TARGET}"
          chmod +x "${binary}"
          "${binary}" --help | tee help.txt
          grep -q '^Usage:' help.txt

      - name: Run CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.value }}
          TARGET: ${{ matrix.target }}
        run: |
          & ".\burrito_out\skopos-$env:VERSION-$env:TARGET" --help | Tee-Object help.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path help.txt -Pattern '^Usage:')) { exit 1 }

  build-image:
    needs: [verify, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: SKOPOS_VERSION=${{ needs.version.outputs.value }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, validate-cli, build-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skopos-${{ needs.version.outputs.value }}-cli
          path: burrito_out
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Publish CLI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" burrito_out/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" burrito_out/* \
              --title "Skopos ${VERSION}" --generate-notes
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          images=()
          for digest in /tmp/digests/*; do
            images+=("${IMAGE}@sha256:$(basename "${digest}")")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${images[@]}"
