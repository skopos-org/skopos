name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl autoconf automake libtool pkg-config libssl-dev
      - name: Build documentation
        run: |
          mix deps.get
          for config in docs/*/ex_doc.exs; do
            language=$(basename "$(dirname "$config")")
            EXDOC_LANGUAGE="$language" mix docs --warnings-as-errors
          done
          cp docs/index.html doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
