name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.diff.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes requiring source verification
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Missing history must not exempt a change from verification.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo 'source=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          range="$BASE_SHA..$HEAD_SHA"
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            range="$BASE_SHA...$HEAD_SHA"
          fi
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          # Treat renames as deletion + addition so both paths are checked.
          if ! git diff --name-only --no-renames -z "$range" > "$changed_files"; then
            echo 'source=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|README.md|LICENSE|NOTICE|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md)
                ;;
              *)
                source=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "source=$source" >> "$GITHUB_OUTPUT"

  source:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl autoconf automake libtool pkg-config libssl-dev
          mix deps.get
          mix assets.setup
      - name: Verify source
        env:
          MIX_ENV: test
        run: |
          mix ash.codegen --check
          mix precommit
          mix cmd --cd assets corepack pnpm exec vp test
          cargo fmt --manifest-path native/ipmi_nif/Cargo.toml --check
      - name: Verify CLI composition
        env:
          MIX_ENV: cli
        run: |
          mix compile --warnings-as-errors
          mix run --no-halt -- --help > cli-help.txt
          grep -q '^Usage:' cli-help.txt

  verify:
    if: always()
    needs: [changes, source]
    runs-on: ubuntu-24.04
    steps:
      - name: Check verification result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SOURCE: ${{ needs.changes.outputs.source }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          case "$CHANGES_RESULT:$RUN_SOURCE:$SOURCE_RESULT" in
            success:true:success)
              echo 'Source verification passed.'
              ;;
            success:false:skipped)
              echo 'No changes requiring source verification.'
              ;;
            *)
              echo '::error::Required verification did not complete successfully.'
              exit 1
              ;;
          esac
